<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/journal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Journal is a simple web app for writing your thoughts and keeping track of life. Log sleep, rate days, and never forget another day with Journal."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <title>Journal</title>
    <script>
      (function() {
        try {
          if (window.location.pathname === '/' || window.location.pathname === '') {
            var hasSession = false;
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') > 0) {
                var item = localStorage.getItem(key);
                if (item && item.indexOf('"access_token"') !== -1) {
                  hasSession = true;
                  break;
                }
              }
            }
            if (hasSession) {
              window.history.replaceState(null, '', '/home' + window.location.search + window.location.hash);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
